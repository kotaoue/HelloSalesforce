name: Generate Objects Index

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/gen-objects-index/go.mod

      - name: Generate objects index
        run: go run ./scripts/gen-objects-index/main.go docs/objects > docs/objects/index.md

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/objects/index.md
          git diff --cached --quiet || git commit -m "chore: update objects index [skip ci]"
          git push
