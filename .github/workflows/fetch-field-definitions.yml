name: Fetch FieldDefinition

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: echo "$SFDX_AUTH_URL" | npx sf org login sfdx-url --sfdx-url-file /dev/stdin --set-default

      - name: Fetch FieldDefinition
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: npm run fetch-field-definitions

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/field-definitions.json docs/field-definitions.csv
          git diff --cached --quiet || git commit -m "chore: update field-definitions [skip ci]"
          git push
