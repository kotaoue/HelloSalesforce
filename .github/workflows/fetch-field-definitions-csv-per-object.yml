name: Fetch FieldDefinition (CSV per object)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 3"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: echo "$SFDX_AUTH_URL" | npx sf org login sfdx-url --sfdx-url-file /dev/stdin --set-default

      - name: Fetch FieldDefinition (CSV per object)
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          OUTPUT_DIR: docs/objects
        run: npm run fetch-field-definitions:csv-per-object

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/objects/
          git diff --cached --quiet || git commit -m "chore: update field definitions CSV per object [skip ci]"
          git push
